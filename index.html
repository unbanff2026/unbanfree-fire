    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --ff-red: #ff0000;
            --ff-dark-red: #8b0000;
            --ff-black: #050505;
        }

        body {
            background-color: var(--ff-black);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* FUNDO REALISTA SETUP GAMER */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background-image: url('https://wallpaperaccess.com/full/1206545.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: -3;
            filter: brightness(0.3) contrast(1.2);
        }

        .bg-darken {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%),
                        linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.9));
            z-index: -2;
        }

        /* CANVAS PARA PARTÍCULAS TIPO DNA/CONEXÕES */
        #particle-canvas {
            position: fixed;
            inset: 0;
             z-index: -1;
             pointer-events: none;
             background: transparent;
        }

        /* PAINEL 3D */
        .glass-panel {
            background: rgba(10, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border: 2px solid var(--ff-red);
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.4), inset 0 0 20px rgba(255, 0, 0, 0.2);
            border-radius: 24px;
            width: 90%;
            max-width: 520px;
            padding: 42px 40px;
            text-align: center;
            z-index: 10;
            transition: transform 0.1s ease;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        .input-field {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #400;
            transition: all 0.3s ease;
            color: white;
        }

        .input-field:focus {
            border-color: var(--ff-red);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            outline: none;
        }

        .btn-ff {
            background: linear-gradient(135deg, var(--ff-red), var(--ff-dark-red));
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .btn-ff:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--ff-red);
            filter: brightness(1.2);
        }

        .log-screen {
            background: #000;
            border: 1px solid #300;
            font-family: 'Courier New', monospace;
            color: #ff4444;
            font-size: 11px;
        }

        .hidden { display: none; }
    </style>
</head>

                ACESSO <span class="text-red-600">UNBAN</span> FREE FIRE
            </h1>
            <div class="h-1 w-16 bg-red-600 mx-auto mt-2 rounded-full"></div>
        </div>

        <!-- TELA DE LOGIN -->
        <div id="login-screen" class="space-y-5">
            <div class="space-y-4">
                <div class="relative">
                    <i data-lucide="user" class="absolute left-3 top-3 w-5 h-5 text-red-600"></i>
                    <input type="text" id="user" placeholder="Usuário" class="input-field w-full py-3 pl-10 pr-4 rounded-xl">
                </div>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-3 w-5 h-5 text-red-600"></i>
                    <input type="password" id="pass" placeholder="Senha" class="input-field w-full py-3 pl-10 pr-4 rounded-xl">
                </div>
            </div>
            <button onclick="doLogin()" class="btn-ff w-full py-4 rounded-xl text-white shadow-lg">
                Entrar no Painel
            </button>
        </div>

        <!-- DASHBOARD UNBAN -->
        <div id="dash-screen" class="hidden space-y-4">
            <div class="space-y-3 text-left">
                <div>
                    <label class="text-[10px] font-bold text-red-500 uppercase ml-1">ID do Jogador</label>
                    <input type="text" id="player-id" placeholder="Ex: 123456789" class="input-field w-full py-3 px-4 rounded-xl">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-red-500 uppercase ml-1">Nome da Conta</label>
                    <input type="text" id="player-name" placeholder="Nick do Jogador" class="input-field w-full py-3 px-4 rounded-xl">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-red-500 uppercase ml-1">Plataforma</label>
                    <select id="platform" class="input-field w-full py-3 px-4 rounded-xl appearance-none">
                        <option value="google">Google</option>
                        <option value="facebook">Facebook</option>
                        <option value="vk">VK</option>
                        <option value="apple">Apple</option>
                    </select>
                </div>
            </div>
            <button id="unban-btn" onclick="startUnban()" class="btn-ff w-full py-4 rounded-xl text-white shadow-lg">
                Aplicar Desbanimento
            </button>
            <div id="log-container" class="log-screen hidden h-32 overflow-y-auto p-3 rounded-xl space-y-1"></div>
        </div>

        <!-- TELA DE PAGAMENTO -->
        <div id="pay-screen" class="hidden text-center space-y-6">
            <div class="bg-red-900/20 border border-red-600/50 p-4 rounded-2xl">
                <i data-lucide="check-circle" class="w-10 h-10 text-red-600 mx-auto mb-2"></i>
                <h2 class="font-orbitron text-lg font-bold text-white">CONTA LOCALIZADA!</h2>
                <p class="text-xs text-gray-400">Banimento HWID identificado. Liberação pendente de taxa de API.</p>
            </div>
            <div class="bg-black/60 p-6 rounded-2xl border border-yellow-600/50">
                <p class="text-[10px] uppercase text-gray-400 mb-1">Taxa de Processamento</p>
                <div class="text-4xl font-black text-white mb-4">R$ 2,00</div>
                <button onclick="redirectToCheckout()" class="btn-ff w-full py-4 rounded-xl text-white flex items-center justify-center gap-2">
                    <i data-lucide="zap" class="w-5 h-5"></i>
                    Pagar via PIX
                </button>
            </div>
            <p class="text-[9px] text-gray-500 uppercase tracking-widest"></p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // --- SISTEMA DE PARTÍCULAS DNA/CONEXÕES ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.radius = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff0000';
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#ff0000';
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 80; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.update();
                p.draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(255, 0, 0, ${1 - dist / 150})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();

        // --- LÓGICA DO SITE ---
        function doLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === 'admin' && p === '123') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dash-screen').classList.remove('hidden');
            } else {
                alert('Acesso Negado!');
            }
        }

        async function startUnban() {
            const id = document.getElementById('player-id').value;
            if(!id) return alert('Insira o ID!');
            const btn = document.getElementById('unban-btn');
            const logs = document.getElementById('log-container');
            btn.disabled = true;
            btn.innerText = 'PROCESSANDO...';
            logs.classList.remove('hidden');
            logs.innerHTML = '';
            const steps = [
                `[INFO] Conectando ao servidor Garena...`,
                `[OK] Socket 192.168.0.1 estabelecido`,
                `[SEARCH] Localizando ID: ${id}...`,
                `[FOUND] Conta Banida (HWID/Account)`,
                `[ACTION] Iniciando Bypass de HWID...`,
                `[PROCESS] Removendo flags de banimento...`,
                `[INFO] Sincronizando com Cloud Garena...`,
                `[SUCCESS] Banimento removido com sucesso!`,
                `[FINAL] Aguardando taxa de liberação (R$ 2,00)...`
            ];
            for(let step of steps) {
                await new Promise(r => setTimeout(r, 800));
                const div = document.createElement('div');
                div.innerText = step;
                logs.appendChild(div);
                logs.scrollTop = logs.scrollHeight;
            }
            setTimeout(() => {
                document.getElementById('dash-screen').classList.add('hidden');
                document.getElementById('pay-screen').classList.remove('hidden');
            }, 1000);
        }

        function redirectToCheckout() {
            window.location.href = 'https://app.pushinpay.com.br/service/pay/a3321907-b6c0-462a-87bd-926a0b3217dc';
        }

        document.addEventListener('mousemove', (e) => {
            const panel = document.getElementById('main-container');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            panel.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body>
</html>
